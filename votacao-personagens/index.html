<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>Sistema de Votação de Personagens</h1>
    </header>

    <main>
        <section>
            <form action="" id="formulario">
                <h2>Votação</h2>
                <label for="">Vote em um personagem</label>
                <select name="" id="personagens">
                    <option value="Selecione">Selecione um personagem</option>
                    <option value="Sonic">Sonic</option>
                    <option value="Dr. Robotnik">Dr. Robotnik</option>
                    <option value="Super Mario">Super Mario</option>
                    <option value="Bowser">Bowser</option>
                </select>
                <button id="votar">Votar</button>

            </form>
            <div id="erro"></div>

        </section>
        <section id="ranking">
            <ul id="lista-ranking"></ul>
        </section>
    </main>

    <footer>
        &copy; Maurício Alves - 24/11/2025
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
